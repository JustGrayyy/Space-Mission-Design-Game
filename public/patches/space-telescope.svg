<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#facc15;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="mirrorGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#fef08a;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:0.5" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#spaceGrad)" stroke="#c084fc" stroke-width="3"/>
  <!-- Stars background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="60" r="1"/><circle cx="200" cy="50" r="0.8"/><circle cx="40" cy="180" r="1.2"/>
    <circle cx="220" cy="200" r="0.6"/><circle cx="100" cy="220" r="1"/><circle cx="180" cy="90" r="0.8"/>
    <circle cx="60" cy="100" r="1"/><circle cx="190" cy="160" r="0.7"/>
  </g>
  <!-- Telescope body -->
  <g transform="translate(128, 128)">
    <!-- Main tube -->
    <rect x="-35" y="-55" width="70" height="110" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="-30" y="-50" width="60" height="100" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Primary mirror -->
    <ellipse cx="0" cy="45" rx="28" ry="12" fill="url(#mirrorGrad)" stroke="#facc15" stroke-width="2"/>
    <ellipse cx="0" cy="45" rx="24" ry="10" fill="none" stroke="#facc15" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- Secondary mirror struts -->
    <line x1="-20" y1="-40" x2="0" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-40" x2="0" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-40" x2="0" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-40" x2="0" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round" transform="rotate(90)"/>
    <!-- Secondary mirror -->
    <circle cx="0" cy="-12" r="8" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <!-- Sunshield layers -->
    <g opacity="0.8">
      <ellipse cx="0" cy="-60" rx="55" ry="6" fill="#c084fc" stroke="#a855f7" stroke-width="1.5"/>
      <ellipse cx="0" cy="-66" rx="52" ry="5" fill="#c084fc" stroke="#a855f7" stroke-width="1" opacity="0.7"/>
      <ellipse cx="0" cy="-72" rx="49" ry="4" fill="#c084fc" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    </g>
    <!-- Solar panels -->
    <rect x="-70" y="-20" width="28" height="40" rx="2" fill="url(#goldGrad)" stroke="#facc15" stroke-width="1.5"/>
    <rect x="42" y="-20" width="28" height="40" rx="2" fill="url(#goldGrad)" stroke="#facc15" stroke-width="1.5"/>
    <!-- Solar panel cells -->
    <g fill="#0f172a" stroke="#facc15" stroke-width="0.5">
      <rect x="-68" y="-18" width="24" height="8" rx="1"/><rect x="-68" y="-8" width="24" height="8" rx="1"/>
      <rect x="-68" y="2" width="24" height="8" rx="1"/><rect x="-68" y="12" width="24" height="8" rx="1"/>
      <rect x="44" y="-18" width="24" height="8" rx="1"/><rect x="44" y="-8" width="24" height="8" rx="1"/>
      <rect x="44" y="2" width="24" height="8" rx="1"/><rect x="44" y="12" width="24" height="8" rx="1"/>
    </g>
  </g>
  <!-- Orbital ring -->
  <ellipse cx="128" cy="128" rx="100" ry="30" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6" stroke-dasharray="8,6"/>
  <!-- Mission text -->
  <text x="128" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" letter-spacing="1.5">SPACE TELESCOPE</text>
  <text x="128" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#c4b5fd">1800 KM IR OBSERVATORY</text>
</svg>