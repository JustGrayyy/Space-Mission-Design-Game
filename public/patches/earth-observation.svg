<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3366;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0c4b8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#092e5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#earthGrad)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Earth silhouette -->
  <ellipse cx="128" cy="128" rx="70" ry="70" fill="rgba(38,120,71,0.6)"/>
  <ellipse cx="128" cy="128" rx="65" ry="65" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- Polar caps -->
  <ellipse cx="128" cy="45" rx="68" ry="18" fill="#e8f5ff" opacity="0.7"/>
  <ellipse cx="128" cy="211" rx="68" ry="18" fill="#e8f5ff" opacity="0.7"/>
  <!-- Orbital ring -->
  <ellipse cx="128" cy="128" rx="100" ry="30" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.9"/>
  <!-- Satellite icon -->
  <g transform="translate(128, 128)">
    <rect x="-8" y="-25" width="16" height="10" rx="2" fill="#cbd5e1" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-20" y="-20" width="12" height="20" rx="1" fill="#64748b"/>
    <rect x="8" y="-20" width="12" height="20" rx="1" fill="#64748b"/>
    <circle cx="0" cy="-18" r="3" fill="#f59e0b"/>
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>
  <!-- Mission text -->
  <text x="128" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" letter-spacing="1.5">EARTH OBSERVATION</text>
  <text x="128" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#93c5fd">LEO CLIMATE SENTINEL</text>
</svg>